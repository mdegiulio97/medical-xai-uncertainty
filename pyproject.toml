[project]
name = "cxr-xai-uncertainty"
version = "0.1.0"
description = "Classificatore chest X-ray spiegabile con quantificazione dell'incertezza (MC-Dropout) e Grad-CAM su PneumoniaMNIST"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "pillow>=10.0",
    "torch>=2.2",
    "torchvision>=0.17",
    "medmnist>=3.0",
    "streamlit>=1.36",
    "h5py>=3.10",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cxr_xai"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
